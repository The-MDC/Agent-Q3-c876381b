name: "🚀 Deploy → HuggingFace Spaces"
# Production deployment: push to HF Spaces Docker spaces via huggingface_hub.
# Spaces pull the Docker image and serve on HF infrastructure (Ollama Cloud
# handles all model inference — the Spaces containers are CPU-only API servers).
#
# Spaces:
#   Orchestrator  → hf.co/spaces/madDegen/agent-q3-space   (port 7860)
#   WebUI         → hf.co/spaces/madDegen/agent-q3-webui   (port 7860)
#
# Triggers:
#   push to main        → deploy all spaces
#   pull_request        → post Space URLs as PR comment (no redeploy)
#   repository_dispatch → agent-triggered deploy
#   workflow_dispatch   → manual space selector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [agent_deploy, trigger_deploy]
  workflow_dispatch:
    inputs:
      space:
        description: "Space to deploy"
        type: choice
        options:
          - orchestrator
          - webui
          - all
        default: all
      reason:
        description: "Deploy reason"
        required: false
        default: "manual"

permissions:
  contents: read
  pull-requests: write

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────
  pre-deploy-audit:
    name: Pre-deploy Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quick safety + bandit check
        run: |
          pip install safety bandit -q
          python -m venv /tmp/av && source /tmp/av/bin/activate
          pip install -r requirements.txt -q 2>/dev/null || true
          safety check -q 2>/dev/null && echo "Safety: clean" || echo "Safety: done"
          deactivate
          bandit -r orchestrator/ -ll -q 2>/dev/null && echo "Bandit: clean" || echo "Bandit: done"

# ─────────────────────────────────────────────────────────────────────────────
  deploy-spaces:
    name: Deploy → HF Spaces
    runs-on: ubuntu-latest
    needs: pre-deploy-audit
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HF Hub
        run: pip install huggingface_hub

      - name: Determine target spaces
        id: plan
        run: |
          python3 - << 'PYEOF'
          import os

          event  = "${{ github.event_name }}"
          space  = "${{ github.event.inputs.space }}"
          reason = "${{ github.event.inputs.reason }}" or "${{ github.event.client_payload.reason }}"

          if event == "push":
              space  = "all"
              reason = f"push to main ({\"${{ github.sha }}\"[:7]})"
          elif event == "repository_dispatch":
              space  = "${{ github.event.client_payload.space }}" or "all"
          elif not space:
              space = "all"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"space={space}\n")
              f.write(f"reason={reason}\n")
          print(f"Deploying: {space} | Reason: {reason}")
          PYEOF

      - name: Push to HF Spaces
        run: |
          python3 - << 'PYEOF'
          import os, shutil, subprocess
          from huggingface_hub import HfApi

          token  = os.environ["HF_TOKEN"]
          space  = "${{ steps.plan.outputs.space }}"
          reason = "${{ steps.plan.outputs.reason }}"
          sha    = "${{ github.sha }}"

          api = HfApi(token=token)

          SPACES = {
              "orchestrator": {
                  "repo_id":   "madDegen/agent-q3-space",
                  "readme":    "spaces/orchestrator/README.md",
                  "ignore":    ["spaces/webui/", "*.pyc", "__pycache__",
                                ".git", "tests/", ".github/", "deploy-logs/"],
              },
              "webui": {
                  "repo_id":   "madDegen/agent-q3-webui",
                  "readme":    "spaces/webui/README.md",
                  "ignore":    ["spaces/orchestrator/", "orchestrator/",
                                "*.pyc", "__pycache__", ".git",
                                "tests/", ".github/", "deploy-logs/"],
              },
          }

          targets = list(SPACES.values()) if space == "all" else [SPACES[space]]
          deployed, failed = [], []

          for cfg in targets:
              name = cfg["repo_id"]
              try:
                  # Inject Space README (HF frontmatter)
                  if os.path.exists(cfg["readme"]):
                      shutil.copy(cfg["readme"], "README_SPACE.md")

                  api.upload_folder(
                      folder_path=".",
                      repo_id=cfg["repo_id"],
                      repo_type="space",
                      ignore_patterns=cfg["ignore"],
                      commit_message=f"deploy: {reason} ({sha[:7]})",
                  )
                  deployed.append(name)
                  print(f"  OK  {name}")
              except Exception as e:
                  failed.append(name)
                  print(f"  ERR {name}: {e}")
              finally:
                  if os.path.exists("README_SPACE.md"):
                      os.remove("README_SPACE.md")

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary:
              with open(summary, "a") as f:
                  f.write(f"## HF Spaces Deploy\n")
                  f.write(f"- **Deployed**: {', '.join(deployed)}\n")
                  f.write(f"- **Reason**: {reason}\n")
                  f.write(f"- **Commit**: `{sha}`\n\n")
                  f.write(f"| Space | URL |\n|---|---|\n")
                  f.write(f"| Orchestrator | https://huggingface.co/spaces/madDegen/agent-q3-space |\n")
                  f.write(f"| WebUI | https://huggingface.co/spaces/madDegen/agent-q3-webui |\n")

          if failed:
              print(f"\nFailed: {failed}")
              exit(1)
          PYEOF

      - name: Health verification
        run: |
          python3 - << 'PYEOF'
          import httpx, time

          ENDPOINTS = {
              "Orchestrator": "https://maddegen-agent-q3-space.hf.space/health",
              "WebUI":        "https://maddegen-agent-q3-webui.hf.space",
          }

          print("Waiting 60s for Spaces to build...")
          time.sleep(60)

          for name, url in ENDPOINTS.items():
              for attempt in range(4):
                  try:
                      r = httpx.get(url, timeout=20, follow_redirects=True)
                      if r.status_code < 500:
                          print(f"  OK  {name}: HTTP {r.status_code}")
                          break
                  except Exception as e:
                      print(f"  ... {name}: {str(e)[:60]} (attempt {attempt+1})")
                  time.sleep(15)
          PYEOF
        continue-on-error: true

# ─────────────────────────────────────────────────────────────────────────────
  pr-preview:
    name: PR — Post HF Spaces URLs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment Spaces URLs on PR
        uses: actions/github-script@v7
        with:
          script: |
            const sha    = context.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref;

            const body = [
              '## 🤗 HuggingFace Spaces Preview',
              '',
              '> Production spaces — updated on every push to `main`.',
              '',
              '| Space | URL | Role |',
              '|-------|-----|------|',
              '| 🧠 Orchestrator | https://huggingface.co/spaces/madDegen/agent-q3-space | FastAPI + Ollama Cloud |',
              '| 🌐 WebUI | https://huggingface.co/spaces/madDegen/agent-q3-webui | Open WebUI + Pipelines |',
              '| 📦 Dataset | https://huggingface.co/datasets/madDegen/agent-q3 | Training data + memory |',
              '| 🤖 Model repo | https://huggingface.co/madDegen/agent-q3-core | Model registry |',
              '',
              `**Branch:** \`${branch}\` | **Commit:** \`${sha}\``,
              '',
              '### Pre-merge checklist',
              '- [ ] `GET /health` — all 5 Ollama Cloud models report ready',
              '- [ ] `POST /v1/tandem` — tandem reasoning + coding in one call',
              '- [ ] Pipelines `/models` lists 3 agent pipelines',
              '- [ ] Open WebUI shows 5 cloud models + 3 agent pipelines',
              '- [ ] `agent-q3-router` routes code prompt → coder service',
              '- [ ] `agent-q3-tandem` returns reasoning + implementation sections',
              '',
              '### Agent-triggered deploys',
              '```bash',
              'curl -X POST https://api.github.com/repos/MADdegen/Agent-Q3/dispatches \\',
              '  -H "Authorization: Bearer $GH_PAT" \\',
              '  -d \'{"event_type":"agent_deploy","client_payload":{"space":"orchestrator","reason":"post-training-update"}}\'',
              '```',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const bot = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('HuggingFace Spaces')
            );

            if (bot) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: bot.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
