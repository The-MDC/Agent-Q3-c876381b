# =============================================================================
# engine_config.yaml — Agent-Q3 Inference Engine Configuration
#
# ALL inference via Ollama Cloud (no local GGUFs, no GPU required)
# Account: nicholasjmcleod@gmail.com / Device: LN-8RDGA90Ultra
#
# Routing chain:
#   PRIMARY:    Ollama Cloud — 6 cloud sessions hot (nicholasjmcleod/ namespace)
#   SECONDARY:  Moonshot API — free-credit Kimi K2.6 primary orchestrator
#   TERTIARY:   OpenRouter — K2.6 fallback ($0.73/1M in, $3.49/1M out)
#   QUATERNARY: HuggingFace Router — frontier burst
#   QUINARY:    RunPod Serverless — GPU scale-out (AMPERE_16, scale-to-zero)
#   MONITOR:    harmonic-hermes (analysis) + qwen3-coder-53b (remediation)
# =============================================================================

active_engine: "ollama_cloud"

# ── Ollama Cloud (all local model roles — nicholasjmcleod/ namespace) ─────────
# Source: MADdegens/Models HF bucket → ollama create → ollama push
# Account: nicholasjmcleod@gmail.com / Device: LN-8RDGA90Ultra
ollama_cloud:
  account: "nicholasjmcleod@gmail.com"
  device:  "LN-8RDGA90Ultra"
  base_url: "http://ollama:11434"
  max_sessions: 6
  keep_alive: "24h"
  models:
    reasoner:
      tag:       "nicholasjmcleod/kimi-linear:q6_k"
      role:      "1M-ctx ultra-long-context preprocessor / multimodal / instruct"
      services:  [multimodal]
      endpoints: [/v1/instruct, /v1/chat]
    tandem:
      tag:       "nicholasjmcleod/harmonic-hermes:q6_k"
      role:      "reasoning partner / tandem stage-2 / monitor analysis"
      services:  [multimodal, monitor]
      endpoints: [/v1/tandem, /v1/monitor/analyze]
    coder_dedicated:
      tag:       "nicholasjmcleod/qwen3-coder-53b:q6_k"
      role:      "primary + dedicated code generation (53B TOTAL-RECALL / 3B active MoE)"
      services:  [multimodal, coder, monitor]
      endpoints: [/v1/code, /v1/coder, /v1/tandem, /v1/monitor/remediate]
    kimi_distilled:
      tag:       "nicholasjmcleod/kimi-distilled:iq4_xs"
      role:      "structured K2.6-style reasoning (35B MoE / 3B active, always-on <think>)"
      services:  [multimodal, research]
      endpoints: [/v1/reason]
    genstruct:
      tag:       "nicholasjmcleod/genstruct:q6_k"
      role:      "structured generation middleware (pre/post all pipelines)"
      services:  [multimodal, coder, research]
      endpoints: [/v1/generate]
    infinity_parser:
      tag:       "nicholasjmcleod/infinity-parser:latest"
      role:      "parse/extract/transform middleware (pre/post all pipelines)"
      services:  [multimodal, coder, research]
      endpoints: [/v1/parse]

# ── Monitor pair — always-on Harmonic-Hermes + Qwen3-Coder-53B ───────────────
# Independent from main router — uses local Ollama directly
monitor_pair:
  analysis_model:    "nicholasjmcleod/harmonic-hermes:q6_k"
  remediation_model: "nicholasjmcleod/qwen3-coder-53b:q6_k"
  poll_interval_secs: 30
  targets:
    - name: multimodal
      url:  "http://multimodal:8000"
    - name: coder
      url:  "http://coder:8001"
    - name: research
      url:  "http://research:8002"
    - name: mcp-bridge
      url:  "http://mcp-bridge:8004"
    - name: ollama
      url:  "http://ollama:11434"

# ── Moonshot API (secondary — Kimi K2.6 primary orchestrator, free credits) ───
# OpenAI-compatible. Free credits for new accounts at platform.moonshot.ai
# preserve_thinking: true → exposes <think>...</think> in multi-turn
moonshot:
  base_url:          "https://api.moonshot.ai/v1"
  model:             "kimi-k2-0711-preview"
  preserve_thinking: true
  context_length:    131072

# ── OpenRouter (tertiary — K2.6 fallback, $0.73/1M in / $3.49/1M out) ────────
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  model:    "moonshotai/kimi-k2.6"

# ── HuggingFace Router (quaternary — public equivalents of model stack) ────────
hf_router:
  base_url: "https://router.huggingface.co/v1"
  models:
    reasoner:         "moonshotai/Kimi-K2-Instruct-0905"
    tandem:           "NousResearch/Hermes-3-Llama-3.1-8B"
    coder_dedicated:  "Qwen/Qwen3-Coder-480B-A35B-Instruct"
    genstruct:        "NousResearch/Hermes-3-Llama-3.1-8B"
    infinity_parser:  "mistralai/Mistral-7B-Instruct-v0.3"
  token_rotation:
    - env: HF_TOKEN
    - env: HF_TOKEN_2
    - env: HF_TOKEN_3

# ── RunPod Serverless (quinary — GPU burst) ───────────────────────────────────
runpod:
  api_url: "https://api.runpod.ai/v2"
  endpoints:
    reasoner:
      id:          "kukl55t0053lob"
      gpu_class:   "AMPERE_16"
      workers_min: 0
      workers_max: 2
    coder:
      id:          "kukl55t0053lob"
      gpu_class:   "AMPERE_16"
      workers_min: 0
      workers_max: 2
  tensorrt_approved: false
  fallback_to_vllm:  true

# ── Routing (cloud_priority: Ollama Cloud → Moonshot → OpenRouter → HF → RunPod)
# Weights calibrated to actual verified subscription capacity (May 2026):
#   Ollama Cloud Pro  ($20/mo):  3 concurrent sessions, ~$0.67/day GPU time
#   Moonshot Tier 0   (free):    1.5M tok/day FREE = ~750 K2.6 req/day; swarm backbone
#   Moonshot Tier 1   ($10 rc):  50 concurrent / 200 RPM after first recharge
#   OpenRouter        (PAYG):    no platform limits; big coding Qwen3-480B + K2.6 overflow
#   HF Router         ($49/mo):  $2 madDegen Pro + ~$4-6 MADdegens Teams = ~$8/mo
#                                 50 ZeroGPU Spaces (Teams) — A100 for Space containers
#   RunPod Community  ($25 dep): ~73 hrs RTX 4090 total @ $0.34/hr, scale-to-zero
routing:
  strategy: "cloud_priority"
  weights:
    local:      38
    moonshot:   37
    openrouter: 15
    hf_router:  8
    runpod:     2

# ── MCP servers (.mcp.json is the authoritative registry) ────────────────────
# Active HTTP servers (bridge connects on boot):
#   reddit-mcp, weather-mcp, kite-trading-mcp, arxiv-mcp,
#   smithery-search, nymbo-tools, hf-dataview, hf-model-search
# Skipped (stdio): playwright-mcp
# Requires container (not in compose yet): searxng-mcp

# ── Tool registry ─────────────────────────────────────────────────────────────
tools:
  search:
    primary:   "perplexity"
    secondary: "exa"
    tertiary:  "tavily"
    fallback:  "free"       # duckduckgo + jina + arxiv + wikipedia + github
  prediction_markets:
    polymarket: true
    mad_gambit: true

