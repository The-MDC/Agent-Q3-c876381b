# =============================================================================
# engine_config.yaml — Agent-Q3 Inference Engine Configuration
#
# ALL inference via Ollama Cloud (no local GGUFs, no GPU required)
# Account: nicholasjmcleod@gmail.com / Device: LN-8RDGA90Ultra
#
# Routing chain:
#   PRIMARY:    Ollama Cloud — 7 cloud sessions hot (nicholasjmcleod/ namespace)
#   SECONDARY:  OpenRouter — cloud burst / fallback
#   TERTIARY:   HuggingFace Router — frontier burst
#   QUATERNARY: RunPod Serverless — GPU scale-out (AMPERE_16, scale-to-zero)
#   MONITOR:    harmonic-hermes (analysis) + ultracoder (remediation) — Ollama pair
# =============================================================================

active_engine: "ollama_cloud"

# ── Ollama Cloud (ALL model roles — nicholasjmcleod/ namespace) ──────────────
# Source: MADdegens/Models HF bucket → ollama create → ollama push
# Account: nicholasjmcleod@gmail.com / Device: LN-8RDGA90Ultra
ollama_cloud:
  account: "nicholasjmcleod@gmail.com"
  device:  "LN-8RDGA90Ultra"
  base_url: "http://ollama:11434"
  max_sessions: 7
  keep_alive: "24h"
  models:
    reasoner:
      tag:       "nicholasjmcleod/kimi-linear:q6_k"
      role:      "primary instruct / multimodal vision / agent / long-ctx"
      services:  [multimodal]
      endpoints: [/v1/instruct, /v1/chat]
    tandem:
      tag:       "nicholasjmcleod/harmonic-hermes:q6_k"
      role:      "reasoning partner / tandem stage-2 / monitor analysis"
      services:  [multimodal, monitor]
      endpoints: [/v1/tandem, /v1/monitor/analyze]
    coder:
      tag:       "nicholasjmcleod/ultracoder:q4_k_m"
      role:      "primary coder / tandem stage-3 / monitor remediation"
      services:  [multimodal, coder, monitor]
      endpoints: [/v1/code, /v1/tandem, /v1/monitor/remediate]
    fallback:
      tag:       "nicholasjmcleod/qwopus:q8_0"
      role:      "fallback when primary overloaded (Q8_0 full-precision)"
      services:  [multimodal]
      endpoints: [/v1/fallback]
    coder_dedicated:
      tag:       "nicholasjmcleod/qwen3-coder-53b:q6_k"
      role:      "dedicated long-form code generation (53B TOTAL-RECALL)"
      services:  [coder]
      endpoints: [/v1/coder]
    genstruct:
      tag:       "nicholasjmcleod/genstruct:q6_k"
      role:      "structured generation middleware (pre/post all pipelines)"
      services:  [multimodal, coder, research]
      endpoints: [/v1/generate]
    infinity_parser:
      tag:       "nicholasjmcleod/infinity-parser:latest"
      role:      "parse/extract/transform middleware (pre/post all pipelines)"
      services:  [multimodal, coder, research]
      endpoints: [/v1/parse]

# ── Monitor pair — always-on Harmonic-Hermes + Ultra-Coder ───────────────────
# Independent from main router — uses local Ollama directly
monitor_pair:
  analysis_model:    "nicholasjmcleod/harmonic-hermes:q6_k"
  remediation_model: "nicholasjmcleod/ultracoder:q4_k_m"
  poll_interval_secs: 30
  targets:
    - name: multimodal
      url:  "http://multimodal:8000"
    - name: coder
      url:  "http://coder:8001"
    - name: research
      url:  "http://research:8002"
    - name: mcp-bridge
      url:  "http://mcp-bridge:8004"
    - name: ollama
      url:  "http://ollama:11434"

# ── OpenRouter (secondary compute — sole model: Kimi-K2.6 multimodal) ────────
# Single capable multimodal handles all OpenRouter fallback requests
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  model:    "moonshotai/kimi-k2.6"

# ── HuggingFace Router (tertiary compute — public equivalents of 7-model stack)
hf_router:
  base_url: "https://router.huggingface.co/v1"
  models:
    reasoner:         "moonshotai/Kimi-K2-Instruct-0905"
    tandem:           "NousResearch/Hermes-3-Llama-3.1-8B"
    coder:            "Qwen/Qwen3-Coder-480B-A35B-Instruct"
    coder_dedicated:  "Qwen/Qwen3-Coder-480B-A35B-Instruct"
    fallback:         "Qwen/Qwen3-235B-A22B-Instruct"
    genstruct:        "NousResearch/Hermes-3-Llama-3.1-8B"
    infinity_parser:  "mistralai/Mistral-7B-Instruct-v0.3"
  token_rotation:
    - env: HF_TOKEN
    - env: HF_TOKEN_2
    - env: HF_TOKEN_3

# ── RunPod Serverless (quaternary — GPU burst) ────────────────────────────────
runpod:
  api_url: "https://api.runpod.ai/v2"
  endpoints:
    reasoner:
      id:          "kukl55t0053lob"
      gpu_class:   "AMPERE_16"
      workers_min: 0
      workers_max: 2
    coder:
      id:          "kukl55t0053lob"
      gpu_class:   "AMPERE_16"
      workers_min: 0
      workers_max: 2
  tensorrt_approved: false
  fallback_to_vllm:  true

# ── Routing (cloud_priority: Ollama Cloud → OpenRouter → HF → RunPod) ────────
routing:
  strategy: "cloud_priority"
  weights:
    local:      60
    openrouter: 20
    hf_router:  15
    runpod:     5

# ── MCP servers (.mcp.json is the authoritative registry) ────────────────────
# Active HTTP servers (bridge connects on boot):
#   reddit-mcp, weather-mcp, kite-trading-mcp, arxiv-mcp,
#   smithery-search, nymbo-tools, hf-dataview, hf-model-search
# Skipped (stdio): playwright-mcp
# Requires container (not in compose yet): searxng-mcp

# ── Tool registry ─────────────────────────────────────────────────────────────
tools:
  search:
    primary:   "perplexity"
    secondary: "exa"
    tertiary:  "tavily"
    fallback:  "free"       # duckduckgo + jina + arxiv + wikipedia + github
  prediction_markets:
    polymarket: true
    mad_gambit: true
  dataset_bucket:
    hf_repo: "madDegen/agent-q3"
    contents:
      - "hq/exports/  — Solidity, prediction markets, LangGraph JSONL"
      - "hq/feedback/ — RLHF/DPO feedback signals"
      - "hq/chroma/   — ChromaDB vectors"
